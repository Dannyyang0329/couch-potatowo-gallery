<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couch Paper Gallery | couch._.potatowo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🥔 Couch Paper Gallery</h1>
            <p>快速跳轉至論文來源</p>
            <div class="jump-box">
                <input type="number" id="postNumber" placeholder="輸入貼文編號 (例如: 1)" pattern="\d*">
                <button onclick="jumpToPaper()">Go!</button>
            </div>
        </header>

        <main>
            <div class="gallery-grid" id="galleryGrid">
                <!-- Dynamically loaded cards -->
            </div>
        </main>
        
        <footer>
            <p>&copy; 2026 couch._.potatowo | AI PhD's Potato Cave</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
